# ===== Debug Mode =====
# Kalau true, plugin akan cetak log tambahan ke console server
# buat bantu troubleshooting (propose, adopsi, bond xp, dll).
# Bisa juga di-toggle langsung in-game pakai /marriageadmin debug <on|off>
debug: false

# ===== Pengaturan Bond Level =====
bond:
  radius: 5.0
  max-daily-xp: 500
  xp-per-mine-block: 1
  xp-per-fish: 3
  xp-per-level: 100        # XP dibutuhkan naik level = xp-per-level * level saat ini

family:
  enabled: true
  allow-adoption: true
  max-children: 4

# ===== Database =====
database:
  file-name: "marriage.db"

# ===== Pesan =====
# Semua pesan di sini boleh diedit bebas, termasuk warna (pakai kode &).
# Placeholder (%player%, %xp%, dst) HARUS tetap ada persis seperti aslinya,
# hanya teks di sekitarnya yang boleh diubah.
messages:
  prefix: "&d[Marriage] &r"

  # ===== Umum / Admin =====
  no-permission: "&cKamu tidak punya izin menggunakan command ini."
  config-reloaded: "&aKonfigurasi berhasil di-reload!"
  debug-status: "&7Debug mode saat ini: %status%"
  debug-usage: "&7Gunakan: /marriageadmin debug <on|off>"
  debug-changed: "&7Debug mode sekarang: %status%"
  admin-usage: "&cGunakan: /marriageadmin <reload|debug> [on|off]"
  admin-unknown-action: "&cAksi tidak dikenal. Gunakan: reload, debug"

  # ===== MarryCommand =====
  usage-marry: "&cGunakan: /marry <propose|accept|deny|divorce|info> [player]"
  unknown-action: "&cAksi tidak dikenal. Gunakan: propose, accept, deny, divorce, info"
  usage-propose: "&cGunakan: /marry propose <player>"
  cooldown-active: "&cTunggu %seconds% detik lagi sebelum membuat lamaran."
  player-not-found: "&cPlayer tidak ditemukan atau sedang offline."
  cannot-propose-self: "&cKamu tidak bisa melamar dirimu sendiri."
  already-married-self: "&cKamu sudah menikah!"
  target-already-married: "&c%player% sudah menikah dengan orang lain."
  target-has-pending-proposal: "&cPlayer tersebut masih memiliki lamaran yang belum dijawab."
  propose-sent: "&aLamaran terkirim ke %player%! Lamaran berlaku selama %timeout% detik."
  propose-received: "&d%player% melamarmu! Ketik &f/marry accept &datau &f/marry deny &d(dalam %timeout% detik)."
  propose-expired-target: "&7Lamaran dari %player% telah kadaluarsa."
  propose-expired-sender: "&7Lamaranmu telah kadaluarsa."
  no-pending-proposal: "&cTidak ada permintaan nikah yang menunggumu."
  proposal-invalid-already-married: "&cLamaran ini sudah tidak valid karena pengirimnya sudah menikah."
  marriage-success: "&aSelamat! Kamu sekarang menikah dengan %player%!"
  marriage-success-notify-proposer: "&a%player% menerima lamaranmu! Selamat menikah!"
  propose-denied: "&cKamu menolak permintaan nikah."
  propose-denied-notify: "&c%player% menolak lamaranmu."
  not-married: "&cKamu belum menikah."
  divorce-success: "&cKamu resmi bercerai."
  divorce-notify: "&c%player% mengajukan perceraian denganmu."

  # ===== BondManager =====
  bond-xp-gained: "&d❤ &fBond XP &a+%xp% &7(%total% XP)"
  bond-level-up: "&d❤ &fBond Level naik menjadi &eLevel %level%&f!"
  bond-daily-limit: "&cBond XP harian sudah mencapai batas &e%max% XP&c."

  # ===== FamilyCommand =====
